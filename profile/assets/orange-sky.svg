<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">OrangeSky Dev</title>
  <desc id="desc">Open-source tools, thoughtfully built. An orange sun above a quiet horizon on a warm cream background.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf2"/>
      <stop offset="1" stop-color="#fae7d2"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9d45"/>
      <stop offset="1" stop-color="#e8662b"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1280" height="320" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="url(#sky)"/>
    <circle cx="1055" cy="171" r="105" fill="#f7d5ad" opacity="0.55"/>
    <circle cx="1055" cy="171" r="78" fill="url(#sun)"/>
    <path d="M790 220 H1280 V320 H790 Z" fill="#f5dfc7"/>
    <path d="M790 220 H1280" stroke="#d7a67b" stroke-width="2"/>
    <path d="M942 244 H1170 M979 259 H1130 M1012 274 H1097" fill="none" stroke="#dca16b" stroke-width="2" stroke-linecap="round"/>
    <g font-family="Segoe UI, Inter, Arial, sans-serif">
      <text x="64" y="74" fill="#98512d" font-size="14" font-weight="600" letter-spacing="3">ORANGESKY.DEV</text>
      <text x="60" y="156" fill="#36271f" font-size="62" font-weight="650" letter-spacing="-2">OrangeSky Dev</text>
      <text x="64" y="204" fill="#775744" font-size="24">Open-source tools, thoughtfully built.</text>
      <path d="M64 255 H124" stroke="#e87834" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>
</svg>
